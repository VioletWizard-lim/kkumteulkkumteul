<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>일정 지도 · 꿈틀꿈틀 핀란드 준비 앱</title>
  <meta name="theme-color" content="#2f6fdf">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root { --primary: #2f6fdf; --text: #1c2433; --bg: #fff; --muted: #667085; }
    @media (prefers-color-scheme: dark) { :root { --text: #e8edf5; --bg: #1a202b; --muted: #9aa5b8; } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
    #bar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; display: flex; align-items: center; gap: 8px;
      padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px);
      box-shadow: 0 1px 6px rgba(0,0,0,.15); }
    #bar h1 { flex: 1; margin: 0; font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #bar button, #bar a { border: 0; border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 14px; font-weight: 700;
      background: #e3ecfd; color: var(--primary); text-decoration: none; cursor: pointer; white-space: nowrap; }
    #map { position: fixed; inset: 0; }
    #msg { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
    #msg[hidden], #gmaps[hidden] { display: none; }
    .map-num span { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #2f6fdf; color: #fff;
      font-weight: 800; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); font-size: 15px; }
    .leaflet-top { top: calc(env(safe-area-inset-top) + 56px); }
  </style>
</head>
<body>
  <div id="bar">
    <h1 id="title">일정 지도</h1>
    <a id="gmaps" target="_blank" rel="noopener" hidden>구글 지도</a>
    <button id="close">닫기</button>
  </div>
  <div id="map"></div>
  <div id="msg" hidden></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 앱의 일정 화면에서 '크게 보기'를 누르면 저장해 둔 지도 정보를 읽어 전체 화면으로 보여 줘요.
    (function () {
      function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
      function showMsg(t) { var m = document.getElementById("msg"); m.textContent = t; m.hidden = false; }
      document.getElementById("close").onclick = function () {
        window.close();
        setTimeout(function () { location.href = "./#/schedule"; }, 200);
      };
      var data = null;
      try { data = JSON.parse(localStorage.getItem("kkumteul.mapview") || "null"); } catch (e) {}
      if (!data || !data.points || !data.points.length) { showMsg("지도 정보가 없어요. 앱의 일정 화면에서 '크게 보기'를 눌러 주세요."); return; }
      document.getElementById("title").textContent = "🗺️ " + (data.title || "일정 지도");
      if (data.gmaps) { var g = document.getElementById("gmaps"); g.href = data.gmaps; g.hidden = false; }
      if (!window.L) { showMsg("지도를 불러오지 못했어요. 인터넷 연결을 확인해 주세요."); return; }
      var map = L.map("map", { zoomControl: true });
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
      var bounds = [];
      data.points.forEach(function (p) {
        var icon = L.divIcon({ className: "map-num", html: "<span>" + p.n + "</span>", iconSize: [30, 30], iconAnchor: [15, 15] });
        L.marker([p.lat, p.lon], { icon: icon }).addTo(map)
          .bindPopup("<b>" + p.n + ". " + esc(p.title) + "</b><br>" + esc(p.time || "") + (p.place ? "<br>📍 " + esc(p.place) : ""));
        bounds.push([p.lat, p.lon]);
      });
      (data.lines || []).forEach(function (line) {
        L.polyline(line.map(function (c) { return [c[1], c[0]]; }), { color: "#2f6fdf", weight: 5, opacity: 0.8 }).addTo(map);
      });
      if (bounds.length === 1) map.setView(bounds[0], 16);
      else map.fitBounds(bounds, { padding: [50, 50] });
    })();
  </script>
</body>
</html>
