name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 뉴스 업데이트 커밋은 push 이벤트를 만들지 않으므로, 뉴스 작업이 끝나면 다시 배포합니다.
  workflow_run:
    workflows: ["Update Finnish education news"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
