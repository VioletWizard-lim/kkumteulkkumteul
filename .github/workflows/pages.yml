name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 뉴스 업데이트 커밋은 push 이벤트를 만들지 않으므로, 뉴스 작업이 끝나면 다시 배포합니다.
  workflow_run:
    workflows: ["Update Finnish education news", "Translate word examples"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Stamp app version
        run: |
          VERSION="$(TZ=Asia/Seoul date +%Y.%m.%d-%H%M)"
          sed -i "s/__APP_VERSION__/${VERSION}/g" js/app.js sw.js
          echo "App version: ${VERSION}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # 업로드 직후엔 GitHub가 파일을 아직 못 찾는 경우가 있어 잠깐 기다렸다가 배포하고, 실패하면 한 번 더 시도합니다.
      - name: Wait for artifact
        run: sleep 20
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - id: deployment
        run: echo "page_url=${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}" >> "$GITHUB_OUTPUT"
