name: Update Finnish education news

on:
  schedule:
    - cron: "0 21 * * *" # 매일 한국 시간 오전 6시
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch today's article
        env:
          # 저장소 Settings → Secrets and variables → Actions 에 등록하면 한국어 요약을 만듭니다 (선택).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch-news.mjs
      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "교육 뉴스 업데이트 $(TZ=Asia/Seoul date +%F)"
          git push
